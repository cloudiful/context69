[package]
name = "context69-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async Rust SDK for the Context69 HTTP API."
readme = "README.md"
repository = "https://github.com/cloudiful/context69"
homepage = "https://github.com/cloudiful/context69"
documentation = "https://docs.rs/context69-sdk"
keywords = ["context69", "sdk", "api", "search"]
categories = ["api-bindings", "web-programming::http-client"]
publish = ["crates-io"]

[dependencies]
context69-contracts.workspace = true
reqwest = { workspace = true, features = [ "charset", "gzip", "http2", "json", "multipart", "rustls", "system-proxy" ] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
url.workspace = true
uuid = { workspace = true, features = [ "serde", "v4", "v5" ] }

[dev-dependencies]
axum = { workspace = true, features = [ "json" ] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
