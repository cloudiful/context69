[package]
name = "context69-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared request and response types for the Context69 API."
readme = "README.md"
repository = "https://github.com/cloudiful/context69"
homepage = "https://github.com/cloudiful/context69"
documentation = "https://docs.rs/context69-contracts"
keywords = ["context69", "api", "contracts", "search"]
categories = ["api-bindings", "data-structures"]
publish = ["crates-io"]

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }
context69-contracts-auth.workspace = true
context69-contracts-core.workspace = true
context69-contracts-extraction.workspace = true
context69-contracts-library.workspace = true
context69-contracts-mcp.workspace = true
context69-contracts-namespace.workspace = true
context69-contracts-search.workspace = true
context69-contracts-settings.workspace = true
context69-contracts-sources.workspace = true
context69-contracts-tasks.workspace = true
context69-contracts-translation.workspace = true
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
utoipa = { workspace = true, features = [ "chrono", "uuid" ] }
uuid = { workspace = true, features = [ "serde", "v4", "v5" ] }
