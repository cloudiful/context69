[package]
name = "context69-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared request and response types for the Context69 API."
readme = "README.md"
repository = "https://github.com/cloudiful/context69"
homepage = "https://github.com/cloudiful/context69"
documentation = "https://docs.rs/context69-contracts"
keywords = ["context69", "api", "contracts", "search"]
categories = ["api-bindings", "data-structures"]
publish = ["crates-io"]

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }
rmcp = { workspace = true, features = [ "schemars" ] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
utoipa = { workspace = true, features = [ "chrono", "uuid" ] }
uuid = { workspace = true, features = [ "serde", "v4", "v5" ] }

[dev-dependencies]
serde_json.workspace = true
