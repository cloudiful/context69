[package]
name = "context69-search"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
context69-contracts-core.workspace = true
context69-contracts-search.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
reqwest = { workspace = true, features = ["charset", "gzip", "http2", "json", "rustls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
