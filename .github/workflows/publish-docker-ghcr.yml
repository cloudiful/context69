name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CACHE_IMAGE_NAME: ghcr.io/${{ github.repository }}-buildcache

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

  build-amd64:
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute amd64 tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-amd64\n' "$tag"
            done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=registry,ref=${{ env.CACHE_IMAGE_NAME }}:amd64
          cache-to: |
            type=gha,mode=max,scope=docker-amd64
            type=registry,ref=${{ env.CACHE_IMAGE_NAME }}:amd64,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute arm64 tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-arm64\n' "$tag"
            done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-arm64
            type=registry,ref=${{ env.CACHE_IMAGE_NAME }}:arm64
          cache-to: |
            type=gha,mode=max,scope=docker-arm64
            type=registry,ref=${{ env.CACHE_IMAGE_NAME }}:arm64,mode=max

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-amd64
      - build-arm64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
