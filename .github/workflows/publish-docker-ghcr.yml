name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs_on }}
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: docker-publish-${{ matrix.arch }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: |
          test -n "$VITE_PRIMEUI_LICENSE"
          bun run build

      - name: Build backend binary
        run: cargo build --release --bin context69

      - name: Bundle image inputs
        shell: bash
        run: |
          rm -rf ci-image-input
          mkdir -p ci-image-input/frontend-dist
          install -Dm755 target/release/context69 ci-image-input/context69
          cp -R frontend/dist/. ci-image-input/frontend-dist/
          tar -czf "context69-image-input-${{ matrix.arch }}.tar.gz" ci-image-input

      - name: Upload image input bundle
        uses: actions/upload-artifact@v4
        with:
          name: context69-image-input-${{ matrix.arch }}
          path: context69-image-input-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs_on }}
    needs:
      - prepare
      - build-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download image input bundle
        uses: actions/download-artifact@v4
        with:
          name: context69-image-input-${{ matrix.arch }}

      - name: Unpack image input bundle
        shell: bash
        run: |
          rm -rf ci-image-input
          tar -xzf "context69-image-input-${{ matrix.arch }}.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute architecture tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-${{ matrix.arch }}\n' "$tag"
            done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.prepare.outputs.labels }}

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
