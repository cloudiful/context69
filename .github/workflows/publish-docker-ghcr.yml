name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    needs: prepare
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.arch }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.arch }}-
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --no-save --minimum-release-age 604800

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Build backend binary
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          SCCACHE_S3_KEY_PREFIX: rust/
        run: cargo build --release --target "${TARGET}" --bin context69

      - name: Show sccache stats
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          SCCACHE_S3_KEY_PREFIX: rust/
        run: sccache --show-stats

      - name: Bundle image inputs
        shell: bash
        run: |
          rm -rf ci-image-input
          mkdir -p ci-image-input/frontend-dist
          install -Dm755 "target/${TARGET}/release/context69" ci-image-input/context69
          cp -R frontend/dist/. ci-image-input/frontend-dist/
          tar -czf "context69-image-input-${{ matrix.arch }}.tar.gz" ci-image-input

      - name: Upload image input bundle
        uses: actions/upload-artifact@v7
        with:
          name: context69-image-input-${{ matrix.arch }}
          path: context69-image-input-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs_on }}
    needs:
      - prepare
      - build-artifacts
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image input bundle
        uses: actions/download-artifact@v8
        with:
          name: context69-image-input-${{ matrix.arch }}

      - name: Unpack image input bundle
        shell: bash
        run: |
          rm -rf ci-image-input
          tar -xzf "context69-image-input-${{ matrix.arch }}.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute architecture tags
        id: tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && printf '%s-${{ matrix.arch }}\n' "$tag"
            done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=context69-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=context69-${{ matrix.arch }}

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done <<'TAGS'
          ${{ needs.prepare.outputs.tags }}
          TAGS
