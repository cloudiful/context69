name: Publish Crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version from tag
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ -z "$version" ] || [ "$version" = "$ref" ]; then
            echo "expected a v* tag, got $ref" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  publish-contracts:
    needs: prepare
    uses: ./.github/workflows/_publish-crate.yml
    with:
      package: context69-contracts
      crate_url: https://crates.io/crates/context69-contracts
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  publish-sdk:
    needs:
      - prepare
      - publish-contracts
    uses: ./.github/workflows/_publish-crate.yml
    with:
      package: context69-sdk
      crate_url: https://crates.io/crates/context69-sdk
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  release:
    needs: publish-sdk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
