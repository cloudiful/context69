name: Publish Crate

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      crate_url:
        required: true
        type: string
      expected_version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: ${{ inputs.crate_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify crate version matches tag
        shell: bash
        run: |
          actual_version="$(cargo pkgid -p "${{ inputs.package }}" | sed -E 's|.*#||')"
          if [ "$actual_version" != "${{ inputs.expected_version }}" ]; then
            echo "expected version ${{ inputs.expected_version }} but found $actual_version for ${{ inputs.package }}" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish -p "${{ inputs.package }}" --registry crates-io --token "${{ steps.auth.outputs.token }}"
