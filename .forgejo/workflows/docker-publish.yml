name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@v0.6.0
    with:
      builds: >-
        [{"platform":"linux/amd64","runner":"aio"}]
      before_build_command: rm -rf ci-image-input
      build_command: cargo build --release --bin context69
      binary_mappings: >-
        [{"source":"target/release/context69","destination":"context69"}]
      after_build_command: |
        ci-image-input/context69 export-openapi
        cd frontend
        bun install --no-save --minimum-release-age 604800
        bun run generate:api
        bun run build
        test -f dist/index.html
        mkdir -p ../ci-image-input/frontend-dist
        cp -R dist/. ../ci-image-input/frontend-dist/
      restore_source_timestamps: true
      context: .
      dockerfile: ./forgejo.Dockerfile
      targets: >-
        [{"target":"runtime","image_suffix":""}]
      publish_latest: "false"
      builder_name_prefix: context69
      inline_cache: "true"
      inline_cache_tag: latest-amd64
      push: true
      username: ${{ github.actor }}
    secrets:
      registry_token: ${{ secrets.REGISTRY_TOKEN }}
