[workspace]
members = [
    ".",
    "crates/context69-contracts",
    "crates/context69-sdk",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[package]
name = "context69"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = [ "json", "macros", "multipart" ] }
axum-extra = { version = "0.10.3", features = ["cookie"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
config = { package = "cloudiful-config", version = "0.6.2" }
context69-contracts = { path = "crates/context69-contracts" }
futures = "0.3.32"
jsonwebtoken = "9.3.1"
lopdf = "0.40.0"
qdrant-client = "1.18.0"
reqwest = { version = "0.13.3", default-features = false, features = [ "charset", "gzip", "http2", "json", "multipart", "rustls", "system-proxy" ] }
redis = { version = "1.2.1", features = [ "tokio-comp", "connection-manager" ] }
rmcp = { version = "1.6.0", features = [ "server", "macros", "schemars", "transport-io", "transport-streamable-http-server" ] }
scheduler = { package = "cloudiful-scheduler", version = "0.4.5", features = ["valkey-guard", "valkey-store"] }
server = { package = "cloudiful-server", version = "0.2.3", features = ["axum", "mcp"] }
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.52.3", features = [ "macros", "rt-multi-thread", "signal", "sync", "time" ] }
time = "0.3.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6.10", features = [ "cors" ] }
utoipa = { version = "5.5.0", features = [ "axum_extras", "chrono", "uuid" ] }
uuid = { version = "1.23.1", features = [ "serde", "v4", "v5" ] }

[dev-dependencies]
serde_json = "1.0.149"
tower = "0.5.3"
toml = "1.1.2"
