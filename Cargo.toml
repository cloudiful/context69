[workspace]
members = [
    ".",
    "crates/context69-contracts",
    "crates/context69-db-schema",
    "crates/context69-http-support",
    "crates/context69-namespace",
    "crates/context69-namespace-http",
    "crates/context69-search",
    "crates/context69-search-http",
    "crates/context69-sdk",
    "crates/context69-settings-http",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
axum-extra = "0.12.6"
bytes = "1.12.0"
chrono = "0.4.45"
config = { package = "cloudiful-config", version = "0.6.2" }
context69-contracts = { path = "crates/context69-contracts", version = "0.4.0" }
context69-db-schema = { path = "crates/context69-db-schema", version = "0.4.0" }
context69-http-support = { path = "crates/context69-http-support", version = "0.4.0" }
context69-namespace = { path = "crates/context69-namespace", version = "0.4.0" }
context69-namespace-http = { path = "crates/context69-namespace-http", version = "0.4.0" }
context69-search = { path = "crates/context69-search", version = "0.4.0" }
context69-search-http = { path = "crates/context69-search-http", version = "0.4.0" }
context69-settings-http = { path = "crates/context69-settings-http", version = "0.4.0" }
docling-convert = { package = "cloudiful-docling-convert", version = "0.2.4" }
futures = "0.3.32"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
qdrant-client = "1.18.0"
reqwest = { version = "0.13.4", default-features = false }
redis = "1.3.0"
rmcp = "2.1.0"
schemars = "1.2.1"
scheduler = { package = "cloudiful-scheduler", version = "0.4.12" }
serde = "1.0.228"
serde_json = "1.0.149"
server = { package = "cloudiful-server", version = "0.2.7" }
sha2 = "0.11.0"
sqlx = "0.9.0"
time = "0.3.53"
tokio = "1.52.3"
toml = "1.1.2"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.7"
utoipa = "5.5.0"
uuid = "1.23.4"
db-init = { package= "cloudiful-db-init", version = "0.1.0"}

[package]
name = "context69"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "context69"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = [ "json", "macros", "multipart" ] }
axum-extra = { workspace = true, features = ["cookie"] }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
config.workspace = true
context69-contracts.workspace = true
context69-db-schema.workspace = true
context69-http-support.workspace = true
context69-namespace.workspace = true
context69-namespace-http.workspace = true
context69-search.workspace = true
context69-search-http.workspace = true
context69-settings-http.workspace = true
db-init.workspace = true
docling-convert.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
qdrant-client.workspace = true
reqwest = { workspace = true, features = [ "charset", "gzip", "http2", "json", "multipart", "rustls", "system-proxy" ] }
rmcp = { workspace = true, features = [ "server", "macros", "schemars", "transport-io", "transport-streamable-http-server" ] }
scheduler = { workspace = true, features = ["valkey-guard", "valkey-store"] }
server = { workspace = true, features = ["axum", "mcp"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "sqlx-toml", "tls-rustls", "uuid"] }
tokio = { workspace = true, features = [ "macros", "rt-multi-thread", "signal", "sync", "time" ] }
time.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tower-http = { workspace = true, features = [ "cors" ] }
utoipa = { workspace = true, features = [ "axum_extras", "chrono", "uuid" ] }
uuid = { workspace = true, features = [ "serde", "v4", "v5" ] }

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
toml.workspace = true
