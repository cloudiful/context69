[workspace]
members = [
    ".",
    "crates/context69-contracts",
    "crates/context69-db-schema",
    "crates/context69-http-support",
    "crates/context69-namespace",
    "crates/context69-namespace-http",
    "crates/context69-search",
    "crates/context69-search-http",
    "crates/context69-sdk",
    "crates/context69-settings-http",
    "crates/context69-translation",
]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = "0.8.9"
axum-login = "0.18.0"
bytes = "1.12.1"
base64 = "0.22.1"
chrono = "0.4.45"
config = { package = "cloudiful-config", version = "0.6.2" }
context69-contracts = { path = "crates/context69-contracts", version = "0.8.0" }
context69-db-schema = { path = "crates/context69-db-schema", version = "0.8.0" }
context69-http-support = { path = "crates/context69-http-support", version = "0.8.0" }
context69-namespace = { path = "crates/context69-namespace", version = "0.8.0" }
context69-namespace-http = { path = "crates/context69-namespace-http", version = "0.8.0" }
context69-search = { path = "crates/context69-search", version = "0.8.0" }
context69-search-http = { path = "crates/context69-search-http", version = "0.8.0" }
context69-settings-http = { path = "crates/context69-settings-http", version = "0.8.0" }
context69-translation = { path = "crates/context69-translation", version = "0.8.0" }
docling-convert = { package = "cloudiful-docling-convert", version = "0.2.5" }
futures = "0.3.33"
getrandom = "0.4.3"
qdrant-client = "1.18.0"
rate-limiter = { package = "cloudiful-rate-limiter", version = "0.1.0", features = ["valkey"] }
opendal = { version = "0.54.0", default-features = false, features = ["services-fs", "services-s3"] }
reqwest = { version = "0.13.4", default-features = false }
redis = "1.4.1"
rmcp = "2.2.0"
schemars = "1.2.1"
scheduler = { package = "cloudiful-scheduler", version = "0.4.12" }
serde = "1.0.229"
serde_json = "1.0.151"
server = { package = "cloudiful-server", version = "0.2.7" }
sha2 = "0.11.0"
sqlx = "0.9.0"
time = "0.3.54"
tokio = "1.53.1"
toml = "1.1.3"
tower = "0.5.3"
tower-http = "0.7.0"
tower-sessions = "0.14.0"
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.7"
utoipa = "5.5.0"
uuid = "1.24.0"
whatlang = "0.18.0"
db-init = { package= "cloudiful-db-init", version = "0.1.0"}

[package]
name = "context69"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "context69"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = [ "json", "macros", "multipart" ] }
axum-login.workspace = true
bytes.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
config.workspace = true
context69-contracts.workspace = true
context69-db-schema.workspace = true
context69-http-support.workspace = true
context69-namespace.workspace = true
context69-namespace-http.workspace = true
context69-search.workspace = true
context69-search-http.workspace = true
context69-settings-http.workspace = true
context69-translation.workspace = true
db-init.workspace = true
docling-convert.workspace = true
futures.workspace = true
getrandom.workspace = true
qdrant-client.workspace = true
rate-limiter.workspace = true
opendal.workspace = true
reqwest = { workspace = true, features = [ "charset", "gzip", "http2", "json", "multipart", "rustls", "stream", "system-proxy" ] }
redis = { workspace = true, features = ["connection-manager", "tokio-comp"] }
rmcp = { workspace = true, features = [ "server", "macros", "schemars", "transport-io", "transport-streamable-http-server" ] }
scheduler = { workspace = true, features = ["valkey-guard", "valkey-store"] }
server = { workspace = true, features = ["axum", "mcp"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "sqlx-toml", "tls-rustls", "uuid"] }
tokio = { workspace = true, features = [ "macros", "net", "rt-multi-thread", "signal", "sync", "time" ] }
time.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tower-http = { workspace = true, features = [ "cors" ] }
tower-sessions = { workspace = true, features = ["signed"] }
tower-sessions-redis-store.workspace = true
utoipa = { workspace = true, features = [ "axum_extras", "chrono", "uuid" ] }
uuid = { workspace = true, features = [ "serde", "v4", "v5" ] }

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
toml.workspace = true
